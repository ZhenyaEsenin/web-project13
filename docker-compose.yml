services:
  web:
    image: nginx:alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - db

  backend:
    build:
      context: ./backend
    container_name: project_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - db
    

  db:
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-appdb}
      MYSQL_USER: ${DB_USER:-appuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-apppass}
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"
    depends_on:
      - db

  mock-api:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npx json-server db.json --host 0.0.0.0 --port 3001 --watch"
    volumes:
      - ./mock-api:/app
    ports:
      - "3001:3001"

volumes:
  db_data:
